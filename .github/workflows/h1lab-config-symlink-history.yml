name: h1lab config symlink history cleanup

on:
  push:
    paths:
      - .github/workflows/h1lab-config-symlink-history.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'onecursor5-design/h1-mergify-note-provenance-20260727' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove exact owned history fixture
        shell: bash
        run: |
          set -eu
          set +x
          test -L .mergify.yml
          test -f docs/automation.yml
          test -f docs/control.txt
          test -f protected/control.txt
          rm -f .mergify.yml docs/automation.yml docs/control.txt
          rm -f protected/control.txt
          rmdir docs protected 2>/dev/null || true
          rm -f .github/workflows/h1lab-config-symlink-fixture.yml
          rm -f .github/workflows/h1lab-config-symlink-history.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'h1lab-owned-fixture'
          git config user.email 'h1lab-owned-fixture@users.noreply.github.com'
          git add -A
          git commit -m 'h1lab config symlink history fixture: cleanup'
          git push origin HEAD:main
